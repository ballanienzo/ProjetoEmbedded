[package]
name = "arduino"
version = "0.1.0"
authors = ["Enzo Ballani <ballanienzo07@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "arduino"
test = false
bench = false

[dependencies]
panic-halt = "1.0.0"
ufmt = "0.2.0"
nb = "1.1.0"
embedded-hal = "1.0"
commands = { path = "../commands/" }
postcard = { version = "1.0", default-features = false }

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "0bbec46f7cfee8542f89f0257619d76cddbf835b"
features = ["arduino-mega2560"]
